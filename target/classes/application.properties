spring.datasource.url=jdbc:sqlite:./data/voronkely.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.initialization-mode=always
# Note: Hibernate doesn't provide an official SQLite dialect; if you encounter dialect errors,
# consider adding a community-provided SQLite dialect or a custom dialect implementation.
spring.jpa.database-platform=org.hibernate.dialect.SQLiteDialect
